name: mediaflow
description: A multi-platform media downloader for videos and images.
publish_to: "none"
version: 1.3.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # UI Icons & Fonts
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.1.0

  # Networking
  http: ^1.1.0
  dio: ^5.3.0
  html: ^0.15.4

  # Media Logic
  youtube_explode_dart: ^3.1.0
  # Switched to the maintained fork
  ffmpeg_kit_flutter_new: ^4.1.0

  # Storage & System
  path_provider: ^2.1.1
  permission_handler: ^12.0.3
  gal: ^2.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
